<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ǝɓpƎ-to-Edge</title>
  <!-- ✨ 디지털 폰트 추가 -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic@5.3.0/700.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="left-ui" class="ui-column">
  <div id="hud"></div>
  <!-- ✨ 퀵 재시작 버튼 (좌상단 HUD 아래) -->
  <button id="btnQuickRestart" title="다시 시작">
    <!-- ✨ width, height 24 / stroke-width 4 -->
    <svg viewBox="0 0 40 40" width="20" height="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 7v10h-10"></path>
      <path d="M34.15 25a15 15 0 1 1-3.53-15.6L38 17"></path>
    </svg>
  </button>
</div>
<div id="right-ui" class="ui-column">
  <!-- ✨ 전략실 전용: 도형 종류별 개수 -->
  <div id="piece-counts-ui">
    <div class="count-item">
      <div class="count-icon" data-type="tri"></div>
      <div class="count-number" id="count-tri">0</div>
    </div>
    <div class="count-item">
      <div class="count-icon" data-type="square"></div>
      <div class="count-number" id="count-square">0</div>
    </div>
    <div class="count-item">
      <div class="count-icon" data-type="pent"></div>
      <div class="count-number" id="count-pent">0</div>
    </div>
    <div class="count-item">
      <div class="count-icon" data-type="rhombus"></div>
      <div class="count-number" id="count-rhombus">0</div>
    </div>
  </div>
</div>
<canvas id="cv"></canvas>

<!-- 결과 바 (하단 고정) -->
<div id="resultBar">
  <div class="result-info">
    <p id="resultTitle" class="result-title"></p>
    <p id="resultDesc" class="result-desc"></p>
  </div>
  <div class="btn-row" style="margin-top:0;">
    <button id="btnResultRestart">다시 시작</button>
    <button id="btnResultHome" class="secondary">처음으로</button>
  </div>
</div>

<!-- 일시정지 메뉴 -->
<div id="pauseMenu" class="overlay hidden">
  <div class="panel">
    <h2>일시정지</h2>
    <div class="btn-row">
      <button id="btnResume">계속하기</button>      
    </div>
    <div class="btn-row">
      <button id="btnSave" class="secondary">저장하기</button>
      <button id="btnLoad" class="secondary">불러오기</button>
    </div>
    <div class="btn-row">
      <button id="btnRestart" class="danger">처음으로</button>
    </div>
  </div>
</div>

<!-- 저장/불러오기/규칙다시보기 (기존과 동일) -->
<div id="saveMenu" class="overlay hidden">
  <div class="panel">
    <h2>저장 슬롯</h2>
    <div id="saveSlots" class="slot-list"></div>
    <div class="btn-row"><button id="btnSaveClose" class="secondary">닫기</button></div>
  </div>
</div>
<div id="loadMenu" class="overlay hidden">
  <div class="panel">
    <h2>불러오기</h2>
    <div id="loadSlots" class="slot-list"></div>
    <div class="btn-row"><button id="btnLoadClose" class="secondary">닫기</button></div>
  </div>
</div>
<!-- ✨ 우측 랭킹 패널 (결과 화면일 때만 표시) -->
<div id="rankingPanel" class="ranking-panel hidden">
  <h3 style="margin: 0 0 10px; text-align: center;">명예의 전당</h3>
  <div id="rankingList"></div>
</div>

<!-- 이니셜 입력 오버레이 (중앙) -->
<div id="initialsMenu" class="overlay hidden">
  <div class="panel" style="text-align: center;">
    <h2>랭킹 등록</h2>
    <p>축하합니다! 랭킹 Top 3에 진입했습니다.</p>
    <div style="margin: 20px 0;">
      <input type="text" id="initialsInput" maxlength="3" placeholder="AAA" 
            style="background: #333; color: #fff; border: 2px solid #555; border-radius: 6px; padding: 10px; font-size: 24px; text-align: center; width: 120px; text-transform: uppercase;">
      <p style="font-size: 12px; color: #aaa; margin-top: 8px;">영문 및 숫자 3글자를 입력하세요.</p>
    </div>
    <div class="btn-row" style="justify-content: center;">
      <button id="btnSubmitRanking">확인</button>
    </div>
  </div>
</div>
<!-- ✨ 커스텀 alert/confirm 모달 -->
<div id="customAlertModal" class="overlay hidden" style="z-index: 9999;">
  <div class="panel" style="max-width: 360px; text-align: center;">
    <h2 id="customAlertTitle" style="margin-bottom: 12px;">알림</h2>
    <p id="customAlertMessage" style="margin-bottom: 24px; white-space: pre-line;"></p>
    <div class="btn-row" id="customAlertButtons" style="justify-content: center;">
      <!-- 버튼이 동적으로 삽입됩니다 -->
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
