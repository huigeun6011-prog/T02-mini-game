<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>도형 배치 게임</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 시작 페이지 전용 스타일 */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1e1e24;
      color: #eee;
    }
    .start-title {
      font-size: 2.5rem;
      margin-bottom: 40px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .mode-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .mode-card {
      width: 220px;
      height: 300px;
      background: #2a2a34;
      border: 2px solid #444;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: #eee;
    }
    .mode-card:hover {
      transform: translateY(-5px);
      border-color: #3a6ec0;
      box-shadow: 0 8px 20px rgba(58, 110, 192, 0.3);
    }
    .mode-icon {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    .mode-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .mode-desc {
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      padding: 0 20px;
      line-height: 1.5;
    }
    /* 모드별 색상 포인트 */
    .mode-easy { border-top: 4px solid #50c8b4; }
    .mode-hard { border-top: 4px solid #e05050; }
    .mode-practice { border-top: 4px solid #8a4ad8; }
  </style>
</head>
<body>
  <div class="start-screen">
    <div class="start-title">도형 배치 게임</div>
    <div class="mode-container">
      <!-- 쉬움 -->
      <a href="easy.html?mode=easy" class="mode-card mode-easy">
      <div class="mode-icon">🟢</div>
      <div class="mode-name">쉬움</div>
      <div class="mode-desc">삼각형과 사각형만 사용하여<br>기본기를 익혀보세요.</div>
      </a>

      <!-- 어려움 (현재 페이지로 연결) -->
      <a href="game.html" class="mode-card mode-hard">
        <div class="mode-icon">🔴</div>
        <div class="mode-name">어려움</div>
        <div class="mode-desc">모든 도형을 활용해<br>80% 이상의 채움률에 도전하세요.</div>
      </a>

      <!-- 전략실 -->
      <div class="mode-card mode-practice" onclick="alert('전략실 모드는 준비 중입니다.')">
        <div class="mode-icon">🟣</div>
        <div class="mode-name">전략실</div>
        <div class="mode-desc">배치 순서를 마음대로<br>연습해 볼 수 있는 공간입니다.</div>
      </div>
    </div>
  </div>
</body>
</html>
